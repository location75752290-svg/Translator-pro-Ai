name: Build-Release-AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  Build-Release-AAB:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK and Accept Licenses
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Ensure Environment Configuration
        run: |
          mkdir -p app
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=dummy_key_for_build" > .env
            fi
          fi

      - name: Decode Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            if [ ! -s app/release.keystore ]; then
              rm -f app/release.keystore
            fi
          fi

      - name: Make Gradlew Executable
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error






