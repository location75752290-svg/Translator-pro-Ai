name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure .env file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Setup Gradle Wrapper and Make Executable
        run: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "::warning::gradle-wrapper.jar is invalid or corrupted. Re-generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            chmod +x gradlew
          fi

      - name: Validate Gradle Project
        run: ./gradlew projects --no-daemon

      - name: Restore Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/my-upload-key.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. Generating fallback release keystore for build..."
            keytool -genkeypair -v -keystore app/my-upload-key.jks -alias translatorpro -keyalg RSA -keysize 2048 -validity 10000 -storepass "TPAI-2026-Release-Strong-9X7mK4" -keypass "TPAI-2026-Release-Strong-9X7mK4" -dname "CN=Translator Pro AI, OU=Development, O=AI Studio, L=Mountain View, ST=CA, C=US"
          fi

      - name: Build Release App Bundle (.aab)
        env:
          KEYSTORE_PATH: "app/my-upload-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error
