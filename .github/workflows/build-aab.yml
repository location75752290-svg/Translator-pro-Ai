name: Build-Release-AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  Build-Release-AAB:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Directory Structure and Config
        run: |
          mkdir -p app
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=dummy_key_for_build" > .env
            fi
          fi

      - name: Setup Gradle Wrapper and Make Executable
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar missing, generating..."
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi

      - name: Decode Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            if [ ! -s app/release.keystore ]; then
              echo "Decoded keystore is empty (0 bytes). Removing invalid file."
              rm -f app/release.keystore
            else
              echo "Keystore successfully decoded:"
              ls -lh app/release.keystore
            fi
          else
            echo "No KEYSTORE_BASE64 provided. Build will proceed with fallback signing."
          fi

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error




